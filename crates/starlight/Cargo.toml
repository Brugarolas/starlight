[package]
name = "starlight"
version = "0.1.0"
authors = ["playX <gtashnik11@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = "=1.0.188"
rand = "0.10.3"
mopa = "0.2.2"
ctor = "*"
paste = "1.0.15"
cfg-if = "1.0.5"
once_cell = "1.21.4"
regress = "0.12.0"
dashmap = "6.2.1"
swc_atoms = "0.2.5"
swc_common = "0.11"
swc_ecmascript = { version = "0.52", features = ["parser", "utils", "visit"] }
libc = "0.2.191"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
structopt = "0.3.26"
backtrace = "0.3.76"
intrusive-collections = "*"
ryu-js = "1.0.3"
memmap2 = "0.9.11"
mimalloc = "0.1.52"
chrono = "0.4.45"
const-random = "0.1.18"

#comet = { path = "../../comet" }
starlight-bytecode = { path = "../starlight-bytecode" }
starlight-derive = { path = "../starlight-derive" }
comet = { path = "../../../comet/crates/comet" }
wtf-rs = { path = "../wtf-rs" }

num = "0.4.3"
num-bigint = "0.5.1"

[features]
val-as-f64 = []
val-as-u64 = []
enable-gc-tracking = []
no-inline-caching = []
valgrind = []
# enable performance counter for interpreter/gc/codegen
perf = []
ffi = ["libloading", "libffi"]

default = ["val-as-u64"]

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench_tiny_alloc"
harness = false

[[bench]]
name = "bench_symbol_table"
harness = false


[[bench]]
name = "gcbench"
harness = false

[[bench]]
name = "gcbench-rc"
harness = false


[[bench]]
name = "bench_snapshot"
harness = false


[[bin]]
name = "sl"
path = "src/bin/sl.rs"

[lib]
name = "starlight"
crate-type = ["dylib", "rlib"]
[target.'cfg(all(not(wasm),target_pointer_width="64"))'.dependencies]
libffi = { version = "1.0.0", optional = true }
libloading = { version = "0.7.0", optional = true }

[target.'cfg(not(wasm))'.dependencies]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "memoryapi",
    "winnt",
    "sysinfoapi",
    "minwinbase",
    "errhandlingapi",
    "excpt",
    "minwindef",
    "wincrypt",
] }
