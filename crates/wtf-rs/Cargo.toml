[package]
name = "wtf-rs"
version = "0.1.0"
authors = ["playX <gtashnik11@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.21.4"
parking_lot = "0.12.5"
libc = "0.2.191"
errno = "0.3.14"
rand = "0.10.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "memoryapi",
    "winnt",
    "sysinfoapi",
    "minwinbase",
    "errhandlingapi",
    "excpt",
    "minwindef",
    "wincrypt",
] }
